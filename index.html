<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Capture your thoughts in seconds.</p>
  </header>

  <main>
    <section id="add-section">
      <h2>Add a note</h2>
      <form id="note-form">
        <div class="field grow">
          <label for="note-input">Your note</label>
          <input type="text" id="note-input" placeholder="Type your note here">
        </div>
        <div class="field">
          <label for="note-category">Category</label>
          <select id="note-category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>
        </div>
        <button type="submit" class="btn">Add Note</button>
      </form>
      <p id="error-message" role="alert"></p>
    </section>

    <section id="notes-section">
      <h2>Your notes</h2>
      <label for="search-input" class="sr-only">Search notes</label>
      <input type="search" id="search-input" placeholder="Search notes...">
      <p id="note-count"></p>
      <button type="button" id="clear-all" class="btn btn-danger">Clear all</button> <!-- BONUS -->
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>QuickNotes &copy; 2026. Your notes are saved in this browser.</p>
  </footer>
</body>
</html>
